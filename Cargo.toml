[package]
name = "kaspa-r0-recursion-legacy"
version = "0.1.0"
edition = "2021"
description = "Unsound legacy RISC Zero recursion circuit for Kaspa consensus compatibility only"
repository = "https://github.com/kaspanet/kaspa-r0-recursion-legacy"
license = "Apache-2.0"
readme = "README.md"
build = false
include = ["/src/**", "/LICENSE", "/README.md"]

[lib]
name = "risc0_circuit_recursion"
path = "src/lib.rs"

[dependencies]
risc0-zkp = { version = "=3.0.6", default-features = false }
# Keep the shared RISC Zero dependencies aligned with Rusty Kaspa.
risc0-core = { version = "=3.0.2", default-features = false }
risc0-zkvm-platform = { version = "=2.2.3", default-features = false }

[lints.rust]
# These upstream feature gates stay disabled in the port.
unexpected_cfgs = { level = "deny", check-cfg = ['cfg(feature, values("prove", "std", "test"))'] }
